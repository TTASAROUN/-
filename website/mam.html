 <div class="faq" style="margin-bottom:18px"><details><summary>따사맘 이용 안내 (관리사님 꼭 읽어 주세요)</summary>
  <p>① 따사맘은 <b>관리사님이 쓰는 글</b>을 모으는 곳이에요. 글은 <b>직원 확인 후</b> 공개됩니다. ② 가정의 이름·주소·연락처·집 안 모습, 아기 얼굴과 이름(태명 포함)은 쓰지 말아 주세요. 필요하면 “한 가정”, “아기”처럼 표현해 주세요. ③ 고객을 비방하거나 서비스 불만은 이곳이 아니라 <a href="growth-note.html">열린 의견함</a>에 남겨 주세요. ④ 사진은 아기 얼굴이 나오지 않는 것만 올려 주세요. ⑤ 관리사님 확인을 위해 성함·연락처 뒤 4자리를 받지만 <b>공개되지 않습니다</b>. (문구 확정 후 수정)</p></details></div>
